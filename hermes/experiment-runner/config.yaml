# experiment-runner — mechanical, high-turn, low-reasoning: dispatch a workflow,
# poll it, format a status line. Almost no judgment is required and the loop can
# run for tens of minutes, so this is bound to the cheapest fast model in the
# fleet. The reasoning budget belongs to experiment-analyst, not here.
model:
  provider: anthropic
  default: claude-haiku-4-5-20251001

# Degrade instead of dying when the primary is capped, 429s, or 5xxs.
# VERIFY THIS KEY LANDS: after install run
#   hermes config show | grep -A3 fallback
# The Hermes docs disagree on whether this is top-level or nested under `model:`.
# If it is absent from the RESOLVED config it is being silently ignored — set it
# with the interactive `hermes fallback` command instead, which writes it wherever
# this version expects. A silently-ignored fallback is worse than no fallback.
#
# Load-bearing here: this agent is often mid-poll on a 40-minute paid EC2 run. If
# it dies on a 429 instead of degrading, the run keeps burning money with nobody
# watching it. Do not remove this quietly.
fallback_providers:
  - provider: openrouter
    model: anthropic/claude-haiku-4.5

agent:
  api_max_retries: 0 # fail over fast rather than churn against a capped session
  reasoning_effort: low # dispatch + poll + report; no analysis happens here

# `local`, not `docker`: this agent needs the persistent repo clone and the
# gh CLI's auth state to survive across container lifetimes, and it reads no
# untrusted web content. Its one untrusted input — GitHub Actions logs relaying
# remote VM output — is handled by the SOUL rule against acting on log contents.
terminal:
  backend: local
  cwd: ${ZERO_RTT_REPO_PATH}
  timeout: 300

memory:
  memory_enabled: true # remembers in-flight run ids across wake-ups
  write_approval: false

# Unattended gateway + cron: circuit-break stuck loops. A polling agent is the
# textbook runaway — capped explicitly.
tool_loop_guardrails:
  hard_stop_enabled: true
  loop_caps:
    max_web_searches: 5
    max_subagents: 0

skills:
  guard_agent_created: true # reads CI logs relaying remote VM output
  config:
    experiment-runner:
      # How often to poll a running workflow, and when to give up watching.
      # A 100k run takes tens of minutes; polling faster just burns tokens.
      poll_interval_seconds: 120
      max_watch_minutes: 60
      # Ask before dispatching at or above this IPERF_PARALLEL. Set from what a
      # run at that scale actually costs you — TODO: confirm the figure you want.
      confirm_above_connections: 10000
      workflow: run-experiment.yml
      results_dir: experiments/ci-results

gateway:
  platforms:
    telegram:
      extra:
        allow_from: ${TELEGRAM_ALLOWED_USERS}
        # Two-sided routing: this profile owns /run, and BOTH the analyst and the
        # warden must ignore ^/run for the split to hold. Verify both halves with
        # `hermes config show` after installing all three.
        require_mention: true
        mention_patterns:
          - "^/run"
        disable_link_previews: true
