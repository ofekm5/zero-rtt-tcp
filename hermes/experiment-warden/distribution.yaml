name: experiment-warden
version: 0.1.0
description: Watches for AWS stacks left running and for silent fleet agents; may dispatch only the read-only status action and must never destroy anything.
hermes_requires: ">=0.12.0"
author: ofekm5
license: MIT

# Every secret the profile needs. `hermes profile install` shows these to the
# user, and .env.EXAMPLE must list exactly this set — the validator enforces it.
#
# Deliberately ABSENT: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_PROFILE.
# Stack state is read through GitHub Actions' OIDC role, never from a credential
# on this box.
env_requires:
  - name: CLAUDE_CODE_OAUTH_TOKEN
    description: Binds this profile to the Claude subscription. Highest-frequency profile in the fleet — see the fleet README on the unofficial-OAuth billing caveat before raising its schedule.
    required: true
  - name: OPENROUTER_API_KEY
    description: Buys the fallback model. LOAD-BEARING — this profile exists to break silence, so it must degrade rather than die. Do not remove.
    required: true
  - name: GITHUB_TOKEN
    description: Fine-grained PAT for ofekm5/zero-rtt-tcp with actions:write (dispatch aws-ops.yml action=status) and contents:read. No contents:write. Note the scope cannot restrict WHICH action input is passed — the status-only limit is enforced by SOUL and config, not by the token.
    required: true
  - name: ZERO_RTT_REPO_PATH
    description: Absolute path to the zero-rtt-tcp clone on this box; terminal.cwd resolves to it.
    required: true
  - name: TELEGRAM_BOT_TOKEN
    description: BotFather token for this profile's OWN bot. One bot per profile — Telegram rejects concurrent polling of the same token.
    required: true
  - name: TELEGRAM_ALLOWED_USERS
    description: Your Telegram user id. Without it the bot answers anyone who finds it.
    required: true
  - name: TELEGRAM_HOME_CHANNEL
    description: Chat id the scheduled cost/health checks deliver to. Required — this profile's whole value is unprompted delivery.
    required: true
