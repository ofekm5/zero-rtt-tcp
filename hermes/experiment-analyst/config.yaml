# experiment-analyst — reasoning-heavy, low-volume. It runs a handful of times a
# week and each run is the only place in the fleet where judgment happens:
# reconciling connection counts, spotting truncated data, deciding whether a
# delta is signal. This is where the token budget should go, and the reason the
# runner and warden are bound to a cheap model — so this one can afford not to be.
model:
  provider: anthropic
  default: claude-sonnet-5

# Degrade instead of dying when the primary is capped, 429s, or 5xxs.
# VERIFY THIS KEY LANDS: after install run
#   hermes config show | grep -A3 fallback
# The Hermes docs disagree on whether this is top-level or nested under `model:`.
# If it is absent from the RESOLVED config it is being silently ignored — set it
# with the interactive `hermes fallback` command instead, which writes it wherever
# this version expects. A silently-ignored fallback is worse than no fallback.
#
# Note the tradeoff on THIS profile specifically: a degraded analysis is more
# dangerous than a missing one, because it still reads as an answer. If the
# fallback fires, the agent is instructed by its SOUL to keep flagging uncertainty
# — but prefer re-running the analysis on the primary over trusting a fallback
# read of a subtle result.
fallback_providers:
  - provider: openrouter
    model: anthropic/claude-sonnet-4.5

agent:
  api_max_retries: 0 # fail over fast rather than churn against a capped session
  reasoning_effort: high # the one profile in the fleet that actually reasons

# `local`, not `docker`: it reads a persistent git clone of the results bundles
# and needs that clone to survive across container lifetimes. Its input IS
# untrusted (VM logs, packet captures), which is handled by the SOUL rule against
# acting on bundle contents plus the read-only posture below — not by the
# sandbox. Do not read this as a filesystem lock; profiles do not sandbox.
terminal:
  backend: local
  cwd: ${ZERO_RTT_REPO_PATH}
  timeout: 300

memory:
  memory_enabled: true # carries run-to-run baselines between analyses
  write_approval: false

# Unattended: circuit-break stuck loops.
tool_loop_guardrails:
  hard_stop_enabled: true
  loop_caps:
    max_web_searches: 5
    max_subagents: 0

skills:
  guard_agent_created: true # reads untrusted VM logs and capture data
  write_approval: true # analysis is read-only; nothing here should be writing
  config:
    experiment-analyst:
      results_dir: experiments/ci-results
      # The repo skill that documents bundle layout. Read it, don't guess.
      layout_skill: .claude/skills/offline-analysis/SKILL.md
      # The transport cap that silently truncates output. The SOUL's truncation
      # rule is the reason this agent exists in its current form; keep them in sync.
      ssm_output_cap_bytes: 24000
      # TODO (needs you): which prior runs count as the reference points, and what
      # run-to-run spread you consider normal. Left EMPTY on purpose — a fabricated
      # baseline would make every future comparison confidently wrong.
      baseline_notes:

gateway:
  platforms:
    telegram:
      extra:
        allow_from: ${TELEGRAM_ALLOWED_USERS}
        # Two-sided routing: this profile owns /analyze. It must ALSO stay silent
        # on ^/run (runner) and ^/cost (warden) — that is the other half of the
        # split and it only holds if all three profiles agree. Verify with
        # `hermes config show` after installing all three.
        require_mention: true
        mention_patterns:
          - "^/analyze"
        disable_link_previews: true
